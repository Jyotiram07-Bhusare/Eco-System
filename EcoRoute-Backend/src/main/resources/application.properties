# ==========================================================================
# EcoRoute backend configuration
# Every value can be overridden with an environment variable (shown as ${NAME:default}).
# ==========================================================================

spring.application.name=ecoroute-backend

# The API and the front-end are served from ONE origin (same port), so there are no CORS or mixed-content issues
# and the browser treats http://localhost as a secure context (needed for the Geolocation API).
# Port 8080 is often taken (Oracle, Tomcat, ...), so the default is 8090.
server.port=${PORT:8090}
server.shutdown=graceful
# gzip for JSON, HTML, CSS and JS (the 50 KB start-up payload shrinks several-fold, which matters on a phone over Wi-Fi)
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=never
server.error.include-stacktrace=never

# ---- MySQL -----------------------------------------------------------------
# The database "ecoroute" is created automatically on first start. Nothing else on the server is touched.
# All times are UTC. preserveInstants=false makes the driver store a LocalDateTime exactly as given instead of
# shifting it from the JVM's time zone (without it the values in the tables would be off by your UTC offset).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecoroute}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=false
spring.datasource.username=${DB_USER:root}
# The password is NOT stored in this file (it is committed to git). Put it in config/application.properties
# (git-ignored, see config/application.example.properties) or set the DB_PASSWORD environment variable.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=8000

# Tables are created with CREATE TABLE IF NOT EXISTS on every start (safe to re-run).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8

# ---- MyBatis (XML mappers) -------------------------------------------------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.arg-name-based-constructor-auto-mapping=true
mybatis.configuration.default-fetch-size=200

# ---- Serve the front-end (../EcoRoute) next to the API ----------------------
ecoroute.frontend-dir=${ECOROUTE_FRONTEND:../EcoRoute}
spring.web.resources.static-locations=file:${ecoroute.frontend-dir}/,classpath:/static/
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=true

# ---- Application settings ----------------------------------------------------
# Login tokens
ecoroute.auth.token-ttl-days=30
ecoroute.auth.max-login-failures=6
ecoroute.auth.lockout-minutes=15

# Live location
ecoroute.location.retention-days=90
ecoroute.location.max-batch=200

# Reverse geocoding (turns coordinates into a street address). The SERVER calls OpenStreetMap Nominatim and caches
# the result by ~100 m grid cell. Set to false to keep coordinates entirely inside your own server.
ecoroute.geocoding.enabled=${GEOCODING_ENABLED:true}
ecoroute.geocoding.url=https://nominatim.openstreetmap.org/reverse
ecoroute.geocoding.user-agent=EcoRoute/1.0 (self-hosted demo)
ecoroute.geocoding.min-interval-ms=1100
# the very first call is slow (TLS set-up, DNS), so be generous; the app never waits for it
ecoroute.geocoding.timeout-ms=8000

# Demo account with sample data (created at start-up if missing)
ecoroute.demo.enabled=true
ecoroute.demo.email=alex.morgan@example.com
ecoroute.demo.password=Demo@1234

# Browser origins allowed to call the API from another host (not needed when the front-end is served by this app)
ecoroute.cors-origins=http://localhost:*,http://127.0.0.1:*

# (logging is configured in logback-spring.xml, which Spring Boot picks up automatically)
