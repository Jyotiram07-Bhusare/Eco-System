# Copy this file to  config/application.properties  (same folder) and fill in your values.
# config/application.properties is git-ignored, so your password never ends up in the repository.
# Any property from src/main/resources/application.properties can be overridden here.

# MySQL login (the database "ecoroute" is created automatically)
spring.datasource.username=root
spring.datasource.password=your-mysql-password

